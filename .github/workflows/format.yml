name: Format

on:
  push:
    branches:

permissions:
  contents: write

jobs:
  format:
    name: Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install packages
        run: npm install

      - name: Run format
        run: npm run format

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Format by GitHub Actions
          # 整形結果だけをコミットする。npm install が linux 用の optional
          # 依存を lock に書き足すため、package-lock.json は除外する
          file_pattern: '. :!package-lock.json'
